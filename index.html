<!DOCTYPE html>
<html>
<head>
<title>Ice Drift</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>body{margin:0;overflow:hidden;background:#000;touch-action:none;}canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;transform:translateZ(0);}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<input id="hiddenUN" type="text" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="32" style="position:fixed;opacity:0;pointer-events:none;top:50%;left:50%;width:1px;height:1px;font-size:16px;">
<input id="hiddenPW" type="password" autocomplete="current-password" maxlength="32" style="position:fixed;opacity:0;pointer-events:none;top:50%;left:50%;width:1px;height:1px;font-size:16px;">
<input id="hiddenChat" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="80" style="position:fixed;opacity:0;pointer-events:none;top:80%;left:50%;width:1px;height:1px;font-size:16px;">
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/classes.js"></script>
<script src="js/talents.js"></script>
<script src="js/render.js"></script>
<script src="js/db.js"></script>
<script src="js/realtime.js"></script>
<script src="js/auth.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
